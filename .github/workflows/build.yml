name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q KamusBahasa.zip
      - name: Unduh kamus gratis (FreeDict)
        run: python3 KamusBahasa/scripts/make_dict.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: KamusBahasa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kamus Bahasa build ${{ github.run_number }}
          files: KamusBahasa/app/build/outputs/apk/debug/*.apk
